latent_size: 128
model_type: vicreg
encoder:
  name: GeoFrameTransformerV2
  kwargs:
    latent_size: 128
    num_group: 24
    patch_sizes:
    - 8
    - 16
    encoder_dims: 128
    trans_dim: 128
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    deterministic_fps: true
    sorting_mode: none
    group_sampling: random
    center_input: true
    frame_builder: triad
    frame_eps: 1.0e-06
    use_frame_gating: false
    frame_confidence_floor: 0.25
    num_rbf: 12
    rbf_max_distance: 3.0
    edge_dim: 16
    edge_value_rank: 2
    parity_mode: sensitive
    use_signed_chirality: true
    pool_queries: 2
    pooling_mode: max_mean
    use_gradient_checkpointing: false
compile_encoder: false
vicreg_enabled: true
vicreg_weight: 1.0
vicreg_embed_dim: 128
vicreg_projector_mode: mlp
vicreg_sim_coeff: 25.0
vicreg_std_coeff: 25.0
vicreg_cov_coeff: 1.0
vicreg_std_eps: 0.0001
vicreg_std_target: 1.0
factor_vae_enabled: false
learning_rate: 0.0001
representation_source: vicreg_projector
