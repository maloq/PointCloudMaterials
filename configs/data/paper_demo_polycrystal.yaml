# =============================================================================
# NOTEBOOK-SCALE PAPER POLYCRYSTAL
# =============================================================================
# Derived from the exact paper_version balanced-geometries configuration.
# The box size, grain count, output path, liquid method, and parallelism are
# reduced for an executable notebook. Phase recipes and perturbations are kept.
# =============================================================================
kind: synthetic
data_path: output/notebook_polycrystal
num_points: 128
model_points: 80
radius: 7.4
sample_type: regular
overlap_fraction: 0.1
n_samples: 0
dataset_max_samples: null
train_ratio: 0.8
drop_edge_samples: true
pre_normalize: true
normalize: true

# Optional per-environment cutoff auto-estimation.
# When enabled, the sampling radius is estimated from each synthetic environment's
# `atoms.npy` so neighborhoods contain roughly `target_points` atoms before
# downsampling to `num_points`.
auto_cutoff:
  enabled: false
  target_points: 128
  quantile: 0.995
  estimation_samples_per_file: 4096
  seed: 42
  safety_factor: 1.02
  boundary_margin: 7.4

global:
  L: 48.0
  rho_target: 0.0849
  avg_nn_dist: 2.49
  grain_count: 8
  intermediate_layer_thickness_factor: 2.0
  random_seed: 12345
  output_dir: output/notebook_polycrystal

  parallel:
    enabled: false
    n_workers: 1
    chunk_size: 2

  cell_size_factor: 1.5

# =============================================================================
# PHASE DEFINITIONS
# =============================================================================
phases:
  # ---------------------------------------------------------------------------
  # BCC IRON (single BCC class)
  # ---------------------------------------------------------------------------
  bcc_iron:
    phase_type: crystal_bcc

    structural_params:
      density_target: 0.0849

    perturbations:
      temperature_K: 325.0
      atomic_mass_amu: 55.845
      p_dropout: 0.008
      dropout_relax_radius: 6.5
      dropout_relax_max_fraction: 0.10
      use_elastic_relaxation: true
      rot_bubble_prob: 0.40
      rot_bubble_radius: 7.0
      rot_bubble_angle_deg: 12.0
      density_bubbles:
        - expected_count: 1
          radius: 4.5
          alpha: -0.30
        - expected_count: 1
          radius: 3.5
          alpha: 0.20

  # ---------------------------------------------------------------------------
  # FCC IRON (single FCC class)
  # ---------------------------------------------------------------------------
  fcc_iron:
    phase_type: crystal_fcc

    structural_params:
      density_target: 0.0849

    perturbations:
      temperature_K: 325.0
      atomic_mass_amu: 55.845
      p_dropout: 0.008
      dropout_relax_radius: 6.5
      dropout_relax_max_fraction: 0.10
      use_elastic_relaxation: true
      rot_bubble_prob: 0.40
      rot_bubble_radius: 7.0
      rot_bubble_angle_deg: 12.0
      density_bubbles:
        - expected_count: 1
          radius: 4.5
          alpha: -0.30
        - expected_count: 1
          radius: 3.5
          alpha: 0.20

  # ---------------------------------------------------------------------------
  # HCP IRON (additional geometry class)
  # ---------------------------------------------------------------------------
  hcp_iron:
    phase_type: crystal_hcp

    structural_params:
      density_target: 0.0849

    perturbations:
      temperature_K: 325.0
      atomic_mass_amu: 55.845
      p_dropout: 0.008
      dropout_relax_radius: 6.5
      dropout_relax_max_fraction: 0.10
      use_elastic_relaxation: true
      rot_bubble_prob: 0.40
      rot_bubble_radius: 7.0
      rot_bubble_angle_deg: 12.0
      density_bubbles:
        - expected_count: 1
          radius: 4.5
          alpha: -0.30
        - expected_count: 1
          radius: 3.5
          alpha: 0.20

  # ---------------------------------------------------------------------------
  # AMORPHOUS PHASE WITH SPARSE CRYSTAL NUCLEI
  # ---------------------------------------------------------------------------
  amorphous_pure:
    phase_type: amorphous_mixed

    structural_params:
      min_pair_dist: 2.1
      density_target: 0.078
      embedded_crystal: crystal_fcc
      embedded_probability: 0.05
      embedded_radius: 4.0

    liquid_structure:
      # The full paper configuration uses rdf_constrained. The notebook uses
      # the same paper generator's fast liquid path to keep execution practical.
      method: simple
      target_coordination: 11.0
      rdf_iterations: 600
      rdf_tolerance: 0.06

    perturbations:
      sigma_thermal: 0.28
      temperature_K: 0.0
      atomic_mass_amu: 55.845
      p_dropout: 0.008
      dropout_relax_radius: 3.5
      dropout_relax_max_fraction: 0.06
      use_elastic_relaxation: false
      rot_bubble_prob: 0.15
      rot_bubble_radius: 5.0
      rot_bubble_angle_deg: 8.0
      density_bubbles:
        - expected_count: 1
          radius: 3.0
          alpha: -0.15
        - expected_count: 1
          radius: 2.2
          alpha: 0.10

# =============================================================================
# GRAIN ASSIGNMENT
# =============================================================================
grain_assignment:
  # Explicitly balanced because eight grains are too few for stable probability
  # sampling. The ordering puts the lower-density amorphous phase in two
  # sufficiently large Voronoi regions for complete 128-atom neighborhoods.
  explicit:
    - amorphous_pure
    - bcc_iron
    - hcp_iron
    - fcc_iron
    - fcc_iron
    - bcc_iron
    - hcp_iron
    - amorphous_pure
