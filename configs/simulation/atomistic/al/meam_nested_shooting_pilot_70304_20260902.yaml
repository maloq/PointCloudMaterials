selection:
  # This interval precedes the earliest detected source nucleation (27 ps).
  liquid_calibration_duration_ps: 15.0
  liquid_calibration_quantile: 0.95
  transition_parents_per_temperature: 10
  basin_control_parents_per_temperature: 1
  maximum_parents_per_source_run: 2

futures:
  # A 2x2 pilot is enough to reject p_B=0 or 1 parents. Retained production
  # parents will use 8 momentum samples x 4 thermostat futures.
  momentum_samples_per_parent: 2
  thermostat_futures_per_momentum: 2

basins:
  crystal_min_cluster_atoms: 100
  persistence_frames: 3
  ptm_rmsd_cutoff: 0.10
  cluster_connectivity_cutoff_A: 3.5

dynamics:
  timestep_fs: 3.0
  thermostat_time_fs: 300.0
  monitor_interval_ps: 0.3

potential:
