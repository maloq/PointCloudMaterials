# Multi-GPU execution wrapper for the source-bound 70,304-atom direct-coexistence
# protocol. The queue runs one persistent model per GPU, so two H100s process
# independent temperature/replica trajectories concurrently. Fixed-shape
# compilation is intentionally not enabled until a generated 70,304-atom source
# trajectory establishes a safe edge envelope.
transition_config: configs/simulation/atomistic/al/phase_transition_70304_mpa.yaml
runtime_generator_config: configs/simulation/atomistic/al/phase_context_70304_mpa.yaml

execution:
  # Align checkpoints to the 200-step full-coordinate sampling cadence.
  chunk_steps: 1000
  checkpoint_retention: 2
