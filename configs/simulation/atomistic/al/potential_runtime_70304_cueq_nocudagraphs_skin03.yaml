# First memory-gated H100 candidate for the exact 70,304-atom MPA workload.
# Run this file in a fresh process before attempting the larger-skin candidates.

model_configs: []
reference_model_configs: []
initial_homogeneous_configs: []

temperature_K: 500.0
pressure_GPa: 0.0
timestep_fs: 1.0
thermostat_time_fs: 100.0
barostat_time_fs: 500.0
warmup_steps: 30
measurement_blocks: 6
steps_per_block: 50
random_seed: 84621

maximum_parity_energy_difference_meV_per_atom: 0.02
maximum_parity_force_rmse_eV_per_A: 0.0001
maximum_parity_stress_difference_GPa: 0.0001

runtime_sweep:
  model_config: configs/simulation/atomistic/al/liquid_source_70304_mpa_seed12345_500K.yaml
  initial_homogeneous_config: configs/simulation/atomistic/al/homogeneous_70304_mpa_130ps_source12345_seed35803.yaml
  # The 70k e3nn reference can exceed H100 memory before timing starts. CuEq is
  # the explicit uncompiled production baseline; there is no OOM fallback.
  reference_kernel_backend: cueq
  baseline_variant: cueq_uncompiled_skin03
  variants:
  - name: cueq_uncompiled_skin03
    kernel_backend: cueq
    compile_mode: null
    pad_num_atoms: 0
    pad_num_edges: 0
    neighbor_skin_A: 0.3

  - name: cueq_max_autotune_no_cudagraphs_skin03_edges4600k
    kernel_backend: cueq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 70304
    # 11.8% above the observed 4,115,156-edge long-trajectory maximum.
    pad_num_edges: 4600000
    neighbor_skin_A: 0.3

output_json: output/synthetic_data/al_potential_benchmark/runtime_70304_cueq_nocudagraphs_skin03.json
