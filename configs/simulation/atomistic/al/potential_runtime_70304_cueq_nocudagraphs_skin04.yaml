# Second memory-gated H100 candidate. Run only after the skin-0.3 process fits.

model_configs: []
reference_model_configs: []
initial_homogeneous_configs: []

temperature_K: 500.0
pressure_GPa: 0.0
timestep_fs: 1.0
thermostat_time_fs: 100.0
barostat_time_fs: 500.0
warmup_steps: 30
measurement_blocks: 6
steps_per_block: 50
random_seed: 84621

maximum_parity_energy_difference_meV_per_atom: 0.02
maximum_parity_force_rmse_eV_per_A: 0.0001
maximum_parity_stress_difference_GPa: 0.0001

runtime_sweep:
  model_config: configs/simulation/atomistic/al/liquid_source_70304_mpa_seed12345_500K.yaml
  initial_homogeneous_config: configs/simulation/atomistic/al/homogeneous_70304_mpa_130ps_source12345_seed35803.yaml
  reference_kernel_backend: cueq
  baseline_variant: cueq_uncompiled_skin04
  variants:
  - name: cueq_uncompiled_skin04
    kernel_backend: cueq
    compile_mode: null
    pad_num_atoms: 0
    pad_num_edges: 0
    neighbor_skin_A: 0.4

  - name: cueq_max_autotune_no_cudagraphs_skin04_edges4800k
    kernel_backend: cueq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 70304
    # 10.6% above the 4,341,090-edge maximum in both archived 130 ps paths.
    pad_num_edges: 4800000
    neighbor_skin_A: 0.4

output_json: output/synthetic_data/al_potential_benchmark/runtime_70304_cueq_nocudagraphs_skin04.json
