# Fixed-workload H100 sweep for the exact 16,384-atom MPA crystallization path.
# This is intentionally separate from potential_performance.yaml: it compares runtime
# implementations of one Hamiltonian and does not participate in MPA/MH-1 selection.

model_configs: []
reference_model_configs: []
initial_homogeneous_configs: []

temperature_K: 500.0
pressure_GPa: 0.0
timestep_fs: 1.0
thermostat_time_fs: 100.0
barostat_time_fs: 500.0
warmup_steps: 30
measurement_blocks: 6
steps_per_block: 50
random_seed: 84621

# Every accelerated implementation is checked against an uncompiled e3nn evaluation
# of the identical source coordinates before any timing result is accepted.
# The measured worst FP32 reduction-order difference is 0.011 meV/atom at
# 16,384 atoms; this gate is still orders below the potential's physical error.
maximum_parity_energy_difference_meV_per_atom: 0.02
maximum_parity_force_rmse_eV_per_A: 0.0001
maximum_parity_stress_difference_GPa: 0.0001

runtime_sweep:
  model_config: configs/simulation/atomistic/al/liquid_source_16384_mpa.yaml
  initial_homogeneous_config: configs/simulation/atomistic/al/homogeneous_16384_mpa.yaml
  reference_kernel_backend: e3nn
  baseline_variant: cueq_reduce_overhead_skin03_edges1200k
  variants:
  - name: cueq_reduce_overhead_skin03_edges1200k
    kernel_backend: cueq
    compile_mode: reduce-overhead
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.3

  - name: cueq_max_autotune_skin03_edges1200k
    kernel_backend: cueq
    compile_mode: max-autotune
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.3

  # OEq and hybrid both fail in PyTorch's CUDA-graph memory-pool alias check with
  # reduce-overhead and max-autotune. Their explicit no-CUDA-graph mode is the
  # runnable comparison; failures are documented in the aluminium README.
  - name: cueq_max_autotune_no_cudagraphs_skin03_edges1200k
    kernel_backend: cueq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.3

  - name: oeq_max_autotune_no_cudagraphs_skin03_edges1200k
    kernel_backend: oeq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.3

  - name: hybrid_max_autotune_no_cudagraphs_skin03_edges1200k
    kernel_backend: hybrid_cueq_oeq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.3

  - name: cueq_reduce_overhead_skin05_edges1200k
    kernel_backend: cueq
    compile_mode: reduce-overhead
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.5

  - name: cueq_max_autotune_no_cudagraphs_skin05_edges1200k
    kernel_backend: cueq
    compile_mode: max-autotune-no-cudagraphs
    pad_num_atoms: 16384
    pad_num_edges: 1200000
    neighbor_skin_A: 0.5

  - name: cueq_reduce_overhead_skin05_edges1150k
    kernel_backend: cueq
    compile_mode: reduce-overhead
    pad_num_atoms: 16384
    pad_num_edges: 1150000
    neighbor_skin_A: 0.5

  # This deliberately tests the tight observed envelope. Any edge-budget overrun is a
  # hard benchmark failure, not an automatic padding increase or recompile.
  - name: cueq_reduce_overhead_skin05_edges1100k
    kernel_backend: cueq
    compile_mode: reduce-overhead
    pad_num_atoms: 16384
    pad_num_edges: 1100000
    neighbor_skin_A: 0.5

# TF32 is disabled programmatically for this report. The user-observed TF32 path is not
# benchmarked or eligible for ranking.
output_json: output/synthetic_data/al_potential_benchmark/runtime_variants.json
