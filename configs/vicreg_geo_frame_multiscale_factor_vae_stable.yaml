defaults:
  - vicreg_geo_frame_multiscale_factor_vae
  - _self_

# Conservative FactorVAE fine-tuning from the stable corrected VICReg model.
experiment_name: VICREG_G_MULT_8_16_FACTORVAE_STABLE_G${factor_vae_gamma}_l${latent_size}_N${data.num_points}_M${data.model_points}_${encoder.name}
init_from_checkpoint: output/detached/vicreg_geoframe_corrected_h100_20260829_220250/VICREG_GEOFRAME_MULTISCALE_8_16_l128_CORRECTED_H100_N160_M80_GeoFrameTransformer-epoch=159.ckpt
init_from_checkpoint_strict: false
resume_from_checkpoint: null

# Fine-tune rather than relearn the already-converged VICReg representation.
learning_rate: 1.0e-4
epochs: 60
warmup_enabled: true
warmup_epochs: 2
warmup_start_factor: 0.1
check_val_every_n_epoch: 2
checkpoint_every_n_epochs: 5
# The total validation loss changes scale while gamma warms up, so it cannot
# compare pre-Factor and joint-training epochs fairly.
checkpoint_monitor: clustering/val_silhouette
checkpoint_mode: max
enable_model_summary: false

# Keep projector embeddings invariant to validation/inference batch composition.
# The running statistics are updated by both VICReg views during training.
vicreg_projector_bn_eval_batch_stats: false

# VICReg embeddings are deterministic, unlike the stochastic posterior samples
# used by FactorVAE. Unit Gaussian instance noise (the projected dimensions have
# std target 1) prevents joint and shuffled samples from becoming trivially
# separable. Calibrate the discriminator for two epochs before applying the TC
# penalty, then ramp gamma to the measured equal-gradient scale.
factor_vae_gamma: 5.0
factor_vae_start_epoch: 2
factor_vae_discriminator_warmup_epochs: 2
factor_vae_gamma_warmup_epochs: 5
factor_vae_discriminator_hidden_dim: 128
factor_vae_discriminator_num_hidden_layers: 2
factor_vae_latent_noise_std: 1.0
factor_vae_discriminator_learning_rate: 1.0e-4
factor_vae_discriminator_update_interval: 1
factor_vae_discriminator_betas: [0.5, 0.9]
factor_vae_model_gradient_clip_val: 1.0
factor_vae_discriminator_gradient_clip_val: 1.0
