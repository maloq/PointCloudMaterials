defaults:
  - vicreg_geo_frame_multiscale_factor_vae_stable
  - _self_

# FactorVAE balancing experiment without Gaussian latent instance noise.
experiment_name: VICREG_G_MULT_8_16_FACTORVAE_BALANCED_NO_NOISE_G${factor_vae_gamma}_l${latent_size}_N${data.num_points}_M${data.model_points}_${encoder.name}

# Keep the encoder penalty conservative while weakening and slowing the
# discriminator. The discriminator receives independent halves of each batch.
factor_vae_gamma: 0.1
factor_vae_start_epoch: 5
factor_vae_gamma_warmup_epochs: 10
factor_vae_discriminator_hidden_dim: 64
factor_vae_discriminator_num_hidden_layers: 2
factor_vae_latent_noise_std: 0.0
factor_vae_discriminator_learning_rate: 1.0e-6
factor_vae_discriminator_update_interval: 4
factor_vae_discriminator_betas: [0.5, 0.9]
