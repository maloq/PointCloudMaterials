extends: static.yaml
checkpoint:
  output_dir: output/mace_vicreg_relaxed_20260910/standard_analysis
inputs:
  data_config: null
  inference_batch_size: 128
cache:
  retain_after_analysis: false
runtime:
  profile: fast
  fast:
    snapshot_figure_limit: 6
    real_md_projection_method: null
clustering:
  connected_regimes:
    enabled: false
tsne:
  paper_enabled: false
  umap_comparison_enabled: true
figure_set:
  enabled: false
real_md:
  transitions:
    enabled: false
  temporal:
    flicker:
      enabled: false
topology:
  enabled: true
  batch_size: 128
  num_workers: 2
  ridge_alpha: 1.0
  history_interventions:
  - repeat_anchor
  - reverse_past
  data:
    kind: relaxed_histories
    cache_dir: ${dataset:mace-meam}
    relaxed_manifest: output/mace_al_denoising_20260910/fire/data/manifest.json
    normalization_radius_A: 9.192189
    input_mode: anchor
    num_points: 80
    model_points: 80
  save_inference_cache: false
  save_validation_predictions: false
report:
  root: output/mace
  model_name: full
