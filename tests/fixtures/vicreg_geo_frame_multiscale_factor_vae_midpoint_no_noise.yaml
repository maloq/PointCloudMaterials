data:
  kind: static
  radius: 7.2
  sample_type: regular
  n_samples: 8000000
  num_points: 160
  model_points: 80
  overlap_fraction: 0.3
  drop_edge_samples: true
  edge_drop_layers: 2
  dr: 0.01
  auto_cutoff:
    enabled: false
    target_points: 160
    quantile: 0.995
    estimation_samples_per_file: 4000
    seed: 42
    safety_factor: 1.02
    boundary_margin: 7.2
  sample_cache:
    enabled: true
    cache_dir: datasets/cache/data_ae_multi_material_ready_samples
    local_cache_dir: /dev/shm/${oc.env:USER}/pointcloudmaterials/data_ae_multi_material_ready_samples
    rebuild: false
  data_sources:
  - name: Al
    data_path: datasets/Al/inherent_configurations_off
    radius: 9.192189
    data_files:
    - 166ps.npy
    - 170ps.npy
    - 174ps.npy
    - 175ps.npy
    - 177ps.npy
    - 240ps.npy
  - name: Mg
    data_path: datasets/Mg/inherent_configurations
    radius: 10.169428
    data_files:
    - 940ps.npy
    - 960ps.npy
    - 980ps.npy
    - 990ps.npy
    - 1000ps.npy
    - 1500ps.npy
  - name: Ta
    data_path: datasets/Ta/inherent_configurations
    radius: 9.388275
    max_samples: 246537
    data_files:
    - 2.7ns.npy
    - 2.8ns.npy
    - 2.9ns.npy
    - 3.0ns.npy
    - 3.60ns.npy
  - name: Zr
    data_path: datasets/Zr/inherent_configurations
    radius: 10.415006
    data_files:
    - 160ps.npy
    - 200ps.npy
    - 240ps.npy
    - 280ps.npy
    - 310ps.npy
    - 1560ps.npy
  - name: Al50Ni50
    data_path: datasets/Al50Ni50/inherent_configurations
    radius: 8.221465
    data_files:
    - 0.3ns.npy
    - 0.5ns.npy
    - 0.7ns.npy
    - 0.9ns.npy
    - 2ns.npy
    - 5ns.npy
project_name: pointnet
experiment_name: VICREG_G_MULT_8_16_FACTORVAE_MIDPOINT_NO_NOISE_G${factor_vae_gamma}_l${latent_size}_N${data.num_points}_M${data.model_points}_${encoder.name}
wandb_mode: online
model_type: vicreg
latent_size: 128
load_supervised_checkpoint: null
init_from_checkpoint: output/detached/vicreg_geoframe_corrected_h100_20260829_220250/VICREG_GEOFRAME_MULTISCALE_8_16_l128_CORRECTED_H100_N160_M80_GeoFrameTransformer-epoch=159.ckpt
resume_from_checkpoint: null
encoder:
  name: GeoFrameTransformer
  kwargs:
    latent_size: ${latent_size}
    num_group: 24
    patch_sizes:
    - 8
    - 16
    encoder_dims: 256
    trans_dim: 128
    depth: 6
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    enable_masked_token_objective: false
    deterministic_fps: true
    sorting_mode: none
    group_sampling: random
    center_input: true
    frame_builder: triad
    frame_eps: 1.0e-06
    use_frame_gating: false
    geometry_bias_mode: orientation
    pooling_mode: max_mean
    enable_ray_head: false
compile_encoder: true
encoder_compile_mode: default
encoder_compile_fullgraph: true
encoder_compile_dynamic: false
representation_source: vicreg_projector
learning_rate: 0.0001
batch_size: 4096
precision: bf16-mixed
gradient_clip_val: 1.0
accumulate_grad_batches: 1
auto_batch_size_search: false
auto_batch_size_mode: power
auto_batch_size_init_val: null
auto_batch_size_max_trials: 12
auto_batch_size_steps_per_trial: 3
auto_batch_size_use_single_device: true
auto_batch_size_adjust_accumulate: true
auto_batch_size_target_effective_batch: null
auto_batch_size_strict: false
enable_swa: false
swa_epoch_start: 1000
epochs: 60
max_samples: 0
check_val_every_n_epoch: 2
checkpoint_monitor: clustering/val_silhouette
checkpoint_mode: max
checkpoint_save_top_k: 1
checkpoint_save_last: true
checkpoint_every_n_epochs: 5
run_post_training_analysis: false
run_test_after_training: false
gpu: true
devices:
- 0
- 1
ddp_find_unused_parameters: true
log_every_n_steps: 5
num_workers: 12
scheduler_name: Cosine
scheduler_min_lr: 1.0e-06
warmup_enabled: true
warmup_epochs: 2
warmup_start_factor: 0.1
decay_rate: 0.04
seed_everything: 123
enable_embedding_metrics: false
enable_svm_accuracy: false
enable_probe_metrics: true
supervised_metric_stages:
- test
embedding_metric_stages:
- test
probe_metric_stages:
- val
- test
probe_k: 7
probe_max_samples: 8192
probe_pca_max_components: 128
probe_silhouette_samples: 5000
probe_kmeans_seed_count: 3
probe_kmeans_n_init: 5
probe_seed: 0
probe_best_k_min: 7
probe_best_k_max: 7
max_supervised_samples: 8192
idec_enabled: false
idec_num_clusters: 0
idec_gamma: 0.1
idec_update_interval: 200
idec_delta: 0.001
idec_max_iter: null
idec_use_global_p: true
idec_normalize_z: true
idec_init_kmeans: true
vicreg_enabled: true
vicreg_weight: 1.0
vicreg_sim_coeff: 25.0
vicreg_std_coeff: 25.0
vicreg_cov_coeff: 1.0
vicreg_embed_dim: 128
vicreg_projector_mode: mlp
vicreg_start_epoch: 0
vicreg_jitter_std: 0.01
vicreg_jitter_mode: physical
vicreg_drop_ratio: 0.0
vicreg_neighbor_view: false
vicreg_view_points: ${data.model_points}
vicreg_rotation_mode: none
vicreg_mirror_prob: 0.5
vicreg_strain_std: 0.0
vicreg_occlusion_mode: none
vicreg_std_eps: 0.0001
vicreg_std_target: 1.0
vicreg_radial_enabled: false
factor_vae_enabled: true
factor_vae_gamma: 0.1
factor_vae_start_epoch: 5
factor_vae_discriminator_warmup_epochs: 2
factor_vae_gamma_warmup_epochs: 10
factor_vae_discriminator_hidden_dim: 128
factor_vae_discriminator_num_hidden_layers: 2
factor_vae_latent_noise_std: 0.0
factor_vae_discriminator_learning_rate: 3.0e-06
factor_vae_discriminator_update_interval: 2
factor_vae_discriminator_betas:
- 0.5
- 0.9
factor_vae_model_gradient_clip_val: 1.0
factor_vae_discriminator_gradient_clip_val: 1.0
augmentation:
  rotation_scale: 0.0
  noise_scale: 0.0
  jitter_scale: 0.0
  scaling_range: 0.0
  track_augmentation: false
init_from_checkpoint_strict: false
enable_model_summary: false
vicreg_projector_bn_eval_batch_stats: false
